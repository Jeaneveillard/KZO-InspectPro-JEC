<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 335" width="300" height="335">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A56DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D3B6E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0D3B6E" flood-opacity="0.25"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0D3B6E" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Fond cercle principal -->
  <circle cx="150" cy="130" r="118" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Contour cercle accent -->
  <circle cx="150" cy="130" r="118" fill="none" stroke="#60a5fa" stroke-width="2.5" opacity="0.4"/>
  <circle cx="150" cy="130" r="108" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.15"/>

  <!-- MAISON — Corps -->
  <rect x="85" y="108" width="100" height="75" rx="4" ry="4"
        fill="url(#houseGrad)" stroke="#1A56DB" stroke-width="1.5"/>

  <!-- MAISON — Toit -->
  <polygon points="75,112 150,55 225,112"
           fill="#ffffff" stroke="#1A56DB" stroke-width="2"
           stroke-linejoin="round" filter="url(#softShadow)"/>

  <!-- MAISON — Porte -->
  <rect x="128" y="145" width="24" height="38" rx="3" ry="3"
        fill="#1A56DB" opacity="0.85"/>
  <circle cx="148" cy="165" r="2.5" fill="#ffffff" opacity="0.9"/>

  <!-- MAISON — Fenêtre gauche -->
  <rect x="93" y="120" width="22" height="18" rx="2"
        fill="#bfdbfe" stroke="#1A56DB" stroke-width="1"/>
  <line x1="104" y1="120" x2="104" y2="138" stroke="#1A56DB" stroke-width="0.8"/>
  <line x1="93" y1="129" x2="115" y2="129" stroke="#1A56DB" stroke-width="0.8"/>

  <!-- MAISON — Fenêtre droite -->
  <rect x="155" y="120" width="22" height="18" rx="2"
        fill="#bfdbfe" stroke="#1A56DB" stroke-width="1"/>
  <line x1="166" y1="120" x2="166" y2="138" stroke="#1A56DB" stroke-width="0.8"/>
  <line x1="155" y1="129" x2="177" y2="129" stroke="#1A56DB" stroke-width="0.8"/>

  <!-- LOUPE — Cercle -->
  <circle cx="197" cy="165" r="28" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.95"/>
  <circle cx="197" cy="165" r="28" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
  <!-- Reflet loupe -->
  <circle cx="197" cy="165" r="21" fill="#1A56DB" opacity="0.3"/>
  <circle cx="190" cy="158" r="5" fill="#ffffff" opacity="0.2"/>

  <!-- LOUPE — Manche -->
  <line x1="218" y1="186" x2="236" y2="204"
        stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.95"/>
  <line x1="218" y1="186" x2="236" y2="204"
        stroke="#60a5fa" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Petite croix cible dans la loupe -->
  <line x1="197" y1="150" x2="197" y2="180" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="182" y1="165" x2="212" y2="165" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <circle cx="197" cy="165" r="5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>

  <!-- ============ TEXTE ============ -->

  <!-- KZO — Très prominent -->
  <text x="150" y="290"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="54"
        fill="#1A56DB"
        text-anchor="middle"
        letter-spacing="6">KZO</text>

  <!-- Ligne décorative sous KZO -->
  <rect x="60" y="297" width="180" height="3" rx="1.5" fill="#1A56DB" opacity="0.2"/>
  <rect x="95" y="297" width="110" height="3" rx="1.5" fill="#1A56DB" opacity="0.5"/>

  <!-- InspectPro -->
  <text x="150" y="322"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-weight="600"
        font-size="18"
        fill="#374151"
        text-anchor="middle"
        letter-spacing="3.5">INSPECTPRO</text>

  <!-- Petits points décoratifs -->
  <circle cx="68" cy="317" r="2.5" fill="#1A56DB" opacity="0.4"/>
  <circle cx="232" cy="317" r="2.5" fill="#1A56DB" opacity="0.4"/>

</svg>
